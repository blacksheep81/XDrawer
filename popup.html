<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>X 抽屉</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="popup.css">
<script src="theme.js"></script>
</head>
<body class="popup">

<header class="pop-head">
  <span class="drawer-mark" aria-hidden="true"><i></i><i></i><i></i></span>
  <div class="pop-brand">X 抽屉</div>
</header>

<form class="pop-search" id="popSearchForm">
  <span aria-hidden="true">⌕</span>
  <input id="popSearch" type="search" autocomplete="off" placeholder="搜索收藏库后按 Enter">
</form>

<div class="pop-stats" id="popStats">
  <button type="button" data-open="all"><b id="popAll">–</b><span>全部</span></button>
  <button type="button" data-open="bookmark"><b id="popBookmark">–</b><span>书签</span></button>
  <button type="button" data-open="like"><b id="popLike">–</b><span>喜欢</span></button>
  <button type="button" data-open="saved"><b id="popSaved">–</b><span>手动保存</span></button>
</div>

<p class="pop-latest" id="popLatest">正在读取收藏库…</p>

<div class="pop-actions">
  <button id="popOpen" class="primary" type="button">打开抽屉</button>
  <button id="popScan" class="ghost" type="button">从 X 导入</button>
</div>

<p class="pop-foot"><span class="status-dot"></span> 所有数据仅保存在此浏览器中</p>

<script src="db.js"></script>
<script src="popup.js"></script>
</body>
</html>
